<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> by Bizu </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        body { font-family: "Pretendard", sans-serif; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(12px); }
        .bg-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.05); z-index: -1; }

        /* Tools 목록 펼침: 0fr -> 1fr 로 높이를 자연스럽게 전환 */
        .collapsible {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 400ms cubic-bezier(0.22, 1, 0.36, 1);
        }
        .collapsible > * { overflow: hidden; }
        .collapsible.is-open { grid-template-rows: 1fr; }

        /* 항목은 순차적으로 떠오르듯 등장 */
        .collapsible .tool-item {
            opacity: 0;
            transform: translateY(12px);
            /* --stagger 는 펼칠 때만 적용되고, hover(그림자·테두리)는 지연 없이 반응 */
            transition: opacity 300ms ease var(--stagger, 0ms),
                        transform 300ms cubic-bezier(0.22, 1, 0.36, 1) var(--stagger, 0ms),
                        box-shadow 300ms ease,
                        border-color 300ms ease;
        }
        .collapsible.is-open .tool-item { opacity: 1; transform: none; }

        /* 접힐 때는 지연 없이 한번에 사라지도록 */
        .collapsible:not(.is-open) .tool-item { --stagger: 0ms; }

        .tools-toggle .tools-caret { transition: transform 400ms cubic-bezier(0.22, 1, 0.36, 1); }
        .tools-toggle[aria-expanded="true"] .tools-caret { transform: rotate(180deg); }

        @media (prefers-reduced-motion: reduce) {
            .collapsible,
            .collapsible .tool-item,
            .tools-toggle .tools-caret { transition: none; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center p-6 relative">

    <div class="bg-overlay"></div>

    <div class="max-w-2xl w-full">
        <div id="link-container" class="grid grid-cols-2 sm:grid-cols-4 gap-6">
            </div>

        <div id="tools-panel" class="collapsible">
            <div>
                <div id="tools-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-16">
                    </div>
            </div>
        </div>
    </div>

    <script>
        // 1. 링크 데이터 관리 (여기만 수정하면 버튼이 추가됩니다)
        const links = [
            { name: 'Home', url: 'https://bizu.is-a.dev/', icon: '🏠', color: 'blue' },
            { name: 'GitHub', url: 'https://github.com/sysilion', icon: 'github', color: 'slate' },
            { name: 'Tools', icon: '📁', color: 'emerald', toggle: 'tools' },
            { name: 'Blog', url: '#', icon: '✍️', color: 'amber' }
        ];

        // Tools 클릭 시 하단에 펼쳐지는 목록 (여기만 수정하면 항목이 추가됩니다)
        const tools = [
            { name: 'NTE Tracker', url: 'nte/', icon: '✅' },
            { name: '서브컬쳐 타임라인', url: 'subculture-timeline/', icon: '🎮' },
            { name: 'Red Table Map', url: 'redtable_point/', icon: '🍽️' },
            { name: 'MovieHub', url: 'moviehub/', icon: '🎬' }
        ];

        // 2. 버튼 생성 로직
        const container = document.getElementById('link-container');
        
        links.forEach(link => {
            const isGithub = link.icon === 'github';
            const colorClass = {
                blue: 'hover:border-blue-400 group-hover:bg-blue-600 bg-blue-100 text-blue-600',
                slate: 'hover:border-slate-800 group-hover:bg-slate-800 bg-slate-100 text-slate-800',
                emerald: 'hover:border-emerald-400 group-hover:bg-emerald-600 bg-emerald-100 text-emerald-600',
                amber: 'hover:border-amber-400 group-hover:bg-amber-600 bg-amber-100 text-amber-600'
            }[link.color];

            const iconContent = isGithub 
                ? `<svg class="w-8 h-8 fill-current transition-colors" viewBox="0 0 24 24"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>`
                : `<span class="text-3xl group-hover:scale-110 transition-transform">${link.icon}</span>`;

            const tileClass = `group relative flex flex-col items-center justify-center aspect-square w-full glass border border-slate-200 rounded-3xl shadow-sm hover:shadow-xl transition-all duration-300 hover:scale-105 ${colorClass.split(' ')[0]}`;
            const tileInner = `
                    <div class="w-16 h-16 rounded-2xl flex items-center justify-center transition-colors duration-300 ${colorClass.split(' ').slice(1).join(' ')} group-hover:text-white">
                        ${iconContent}
                    </div>
                    <span class="absolute -bottom-10 opacity-0 translate-y-2 group-hover:opacity-100 group-hover:translate-y-0 transition-all duration-300 text-xs font-bold bg-white px-3 py-1.5 rounded-lg shadow-md border border-slate-100 whitespace-nowrap pointer-events-none">
                        ${link.name}
                    </span>`;

            const caret = `<svg class="tools-caret absolute top-3 right-3 w-4 h-4 text-slate-400" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.19l3.71-3.96a.75.75 0 111.08 1.04l-4.25 4.53a.75.75 0 01-1.08 0L5.21 8.27a.75.75 0 01.02-1.06z" clip-rule="evenodd"/></svg>`;

            container.innerHTML += link.toggle
                ? `<button type="button" data-toggle="${link.toggle}" aria-expanded="false" aria-controls="${link.toggle}-panel" class="tools-toggle ${tileClass}">${tileInner}${caret}</button>`
                : `<a href="${link.url}" target="_blank" rel="noopener noreferrer" class="${tileClass}">${tileInner}</a>`;
        });

        // 2-1. Tools 목록 생성
        document.getElementById('tools-list').innerHTML = tools.map((tool, i) => `
            <a href="${tool.url}" target="_blank" rel="noopener noreferrer" style="--stagger: ${i * 60}ms"
               class="tool-item group flex items-center gap-4 glass border border-slate-200 rounded-2xl px-4 py-3 shadow-sm hover:shadow-lg hover:border-emerald-400">
                <span class="w-11 h-11 shrink-0 rounded-xl bg-emerald-100 flex items-center justify-center text-xl transition-transform group-hover:scale-110">${tool.icon}</span>
                <span class="text-sm font-bold truncate">${tool.name}</span>
            </a>
        `).join('');

        // 2-2. Tools 토글 동작
        const toolsPanel = document.getElementById('tools-panel');
        const toolsBtn = container.querySelector('[data-toggle="tools"]');

        toolsBtn.addEventListener('click', () => {
            const opened = toolsPanel.classList.toggle('is-open');
            toolsBtn.setAttribute('aria-expanded', String(opened));

            // 펼칠 때만, 목록이 다 나타난 뒤 화면에 들어오도록 스크롤
            if (opened) {
                setTimeout(() => toolsPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 420);
            }
        });

        // 3. 배경 GIF 로직 (최신 Fetch API 사용)
        async function updateBackground() {
            try {
                const randomBefore = 1298394752 + Math.round(Math.random() * 148438904);
                const response = await fetch(`https://api.tumblr.com/v2/tagged?api_key=P67Pssx8RaDZEXNtYhuhnW55CgRzCKXGVXSnFmLZSse9Ollvek&tag=gif&before=${randomBefore}&limit=1`);
                const data = await response.json();
                
                const gifUrl = data.response?.[0]?.photos?.[0]?.original_size?.url;
                if (gifUrl) {
                    const img = new Image();
                    img.src = gifUrl;
                    img.id = "BG";
                    img.onload = () => {
                        const oldBg = document.querySelector('img#BG');
                        if(oldBg) oldBg.remove();
                        Object.assign(img.style, {
                            position: 'fixed', inset: 0, width: '100vw', height: '100vh',
                            objectFit: 'cover', zIndex: -2, opacity: '0.15'
                        });
                        document.body.prepend(img);
                    };
                }
            } catch (e) { console.error("배경 로드 실패", e); }
            setTimeout(updateBackground, 5000);
        }
        updateBackground();
    </script>
</body>
</html>
